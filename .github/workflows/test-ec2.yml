name: Build and Deploy to EC2

on:
  push:
    branches:
      - master   # trigger on pushes to master

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # <-- this is required for pushing to GHCR

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 1: Log in to GHCR (GitHub Container Registry)
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | .docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # Step 2: Build and push Docker image
      - name: Build and push Docker image
        run: |
          docker build -f dockerfile -t ghcr.io/praveenbesetti/backend-container:latest .
          docker push ghcr.io/praveenbesetti/backend-container:latest

      # Step 3: Deploy to EC2
      - name: Deploy on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh -o StrictHostKeyChecking=no $EC2_USER@$EC2_HOST << 'EOF'
            docker login ghcr.io -u ${{ github.actor }} --password ${{ secrets.GITHUB_TOKEN }}
            docker pull ghcr.io/praveenbesetti/backend-container:latest
            docker stop backend || true
            docker rm backend || true
            docker run -d --name backend --restart=always -p 5000:5000 ghcr.io/praveenbesetti/backend-container:latest
          EOF
